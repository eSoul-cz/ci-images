; eSoul baseline, copied into every eSoul PHP image (CI, FPM, RoadRunner).
;
; PHP reads conf.d after php.ini, in alphabetical order, so these values win
; over a mounted php.ini. To override one in an application image, add a file
; that sorts later, e.g. "$PHP_INI_DIR/conf.d/zz-app.ini".

; CVE-2026-115560 and the session path of CVE-2026-109619 (PHP2Shell) reach
; session state through upload progress tracking. It must be disabled at
; startup; ini_set() and .user.ini are too late. Hardly any app uses it.
; https://www.php.net/archive/2026.php#2026-10-23-1
session.upload_progress.enabled = 0

; Do not advertise the PHP version in the X-Powered-By response header.
expose_php = Off
