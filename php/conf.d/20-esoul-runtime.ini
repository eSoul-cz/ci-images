; eSoul production runtime defaults, copied into the FPM and RoadRunner images
; only (CI images keep PHP's development-friendly defaults).
;
; Values written as ${VAR:-default} can be changed per container through
; environment variables, without rebuilding the image. PHP uses the default
; only when VAR is unset: an empty VAR yields an empty (false/0) value.

; Errors go to the log (stderr in these images), never into the response.
; RoadRunner workers also use stdout for their relay protocol.
display_errors = Off
display_startup_errors = Off
log_errors = On

; Compile assert() calls out of production code.
zend.assertions = -1

; Files inside an image do not move; cache resolved paths longer.
realpath_cache_ttl = 600

opcache.enable = 1
; Only the CLI SAPI reads this; the RoadRunner image sets it to 1.
opcache.enable_cli = ${PHP_OPCACHE_ENABLE_CLI:-0}
opcache.memory_consumption = ${PHP_OPCACHE_MEMORY_CONSUMPTION:-256}
opcache.interned_strings_buffer = 16
; Laravel with its vendor tree routinely exceeds PHP's default of 10000 files.
opcache.max_accelerated_files = 20000
; Set PHP_OPCACHE_VALIDATE_TIMESTAMPS=0 in application images whose code is
; baked in; keep 1 when code is bind-mounted for development.
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-1}
