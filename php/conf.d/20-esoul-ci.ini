; eSoul CI image defaults, copied into the CI (testing) images only (php/8_4, php/8_5, php/8_6);
; the FPM and RoadRunner images use 20-esoul-runtime.ini instead. Override a value with
; `php -d`, or a later conf.d file such as "$PHP_INI_DIR/conf.d/zz-app.ini".

; PHP leaves opcache off for the CLI by default. Every PHPUnit/PHPStan run is a CLI process, and the cache
; lives only as long as that process (no opcache.file_cache), so the gain is small: measured at roughly
; zero for a 0.3 s suite and a few percent for a multi-second one (see the pull request that added this file).
opcache.enable_cli = 1

; Tests write and include PHP files (Blade views compiled to storage/framework/views, generated proxies or
; caches), and a file can change within one run. Keep timestamp validation on and check on every request
; (the default revalidate_freq of 2 seconds would serve a stale view recompiled within 2 s of its first use).
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Laravel with its vendor tree and dev tools routinely exceeds PHP's default of 10000 files and 128 MB.
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16

; No JIT: a CI run is short, JIT warm-up costs more than it saves, and the coverage drivers (pcov, Xdebug)
; do not work with JIT-compiled code. A zero buffer disables it even if PHP's default changes.
opcache.jit_buffer_size = 0

; No optimizer passes: with pcov, the optimizer's jump threading removes executable lines from the coverage
; report (a `break;` in the variant's Money::allocate vanished: 136 lines instead of 137), so line coverage
; differs from a run without opcache. Xdebug is unaffected; level 0 keeps both drivers identical to a run
; without opcache. The optimizer gains little in a short CLI run anyway.
opcache.optimization_level = 0
